# Default values for AIOps Platform
# This is a YAML-formatted file.

# Global configuration
global:
  environment: production
  imageRegistry: ""

# Collector Service Configuration
collector:
  replicaCount: 2
  image:
    repository: niswa123/aiops-collector
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    kafkaTopic: "aiops.telemetry.events"
    redisRateLimitWindow: 60
    redisRateLimitMaxRequests: 100
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Next.js Dashboard Configuration
dashboard:
  replicaCount: 2
  image:
    repository: niswa123/aiops-dashboard
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: aiops.niswa123.ai
      paths:
        - path: /v1/telemetry
          pathType: Prefix
          backendService: collector
        - path: /auth
          pathType: Prefix
          backendService: collector
        - path: /workspace
          pathType: Prefix
          backendService: collector
        - path: /
          pathType: Prefix
          backendService: dashboard
  tls: []
  #  - secretName: aiops-platform-tls
  #    hosts:
  #      - aiops.niswa123.ai

# Database Credentials & Service Settings
# Note: For production environments, consider disabling the inline subcharts and using external instances.
postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  auth:
    database: aiops_core
    username: aiops_admin
    password: "SecurePostgresPassword123!"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

clickhouse:
  enabled: true
  replicaCount: 1
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.3-alpine"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  auth:
    database: aiops_observability
    username: default
    password: "SecureClickHousePassword123!"
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7.2-alpine"
  persistence:
    enabled: false
    size: 2Gi
  auth:
    password: "SecureRedisPassword123!"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi

redpanda:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: "v23.3.1"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Third party integrations for OAuth/SSO
oauth:
  github:
    clientId: "mock_github_client_id"
    clientSecret: "mock_github_client_secret"
  google:
    clientId: "mock_google_client_id"
    clientSecret: "mock_google_client_secret"
  okta:
    clientId: "mock_okta_client_id"
    clientSecret: "mock_okta_client_secret"
    issuer: "https://mock-okta.okta.com/oauth2/default"
