apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | b64enc | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.auth.password | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc | quote }}
  GITHUB_CLIENT_ID: {{ .Values.oauth.github.clientId | b64enc | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.oauth.github.clientSecret | b64enc | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.oauth.google.clientId | b64enc | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.oauth.google.clientSecret | b64enc | quote }}
  OKTA_CLIENT_ID: {{ .Values.oauth.okta.clientId | b64enc | quote }}
  OKTA_CLIENT_SECRET: {{ .Values.oauth.okta.clientSecret | b64enc | quote }}
