apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  KAFKA_TOPIC: {{ .Values.collector.env.kafkaTopic | quote }}
  
  # Database Hosts pointing to Kubernetes internal DNS entries
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_HOST: "{{ .Release.Name }}-postgres"
  POSTGRES_PORT: "5432"

  CLICKHOUSE_DB: {{ .Values.clickhouse.auth.database | quote }}
  CLICKHOUSE_USER: {{ .Values.clickhouse.auth.username | quote }}
  CLICKHOUSE_HOST: "{{ .Release.Name }}-clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_HTTP_PORT: "8123"

  REDIS_HOST: "{{ .Release.Name }}-redis"
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "{{ .Release.Name }}-redpanda:9092"
  
  # Rates
  REDIS_LIMIT_WINDOW: {{ .Values.collector.env.redisRateLimitWindow | quote }}
  REDIS_LIMIT_MAX_REQUESTS: {{ .Values.collector.env.redisRateLimitMaxRequests | quote }}

  # OAuth Okta Issuer
  OKTA_ISSUER: {{ .Values.oauth.okta.issuer | quote }}
